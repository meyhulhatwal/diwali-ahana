<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Happy Diwali 🪔</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600&family=Caveat:wght@500&display=swap" rel="stylesheet"/>
<style>:root{--gold:#f5c76a;--amber:#ff9d3c;--bg:#05070f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;overflow:hidden;background:#000;color:#fbeed2;font-family:Inter,sans-serif}
.app{position:fixed;inset:0;background:radial-gradient(circle at 50% 80%,#0d1330,var(--bg) 70%);transition:background 1.5s}
.app.s0{background:#000}.app.s2{background:radial-gradient(circle at 50% 45%,#4a2a08,#0a0612 72%)}
.app.s3{background:radial-gradient(circle at 50% 100%,#2a1208,#03040a 70%)}
.app.s4,.app.s6{background:linear-gradient(#050a1c,#1a1030 70%,#2d1528)}
.fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.stars{position:fixed;inset:0;pointer-events:none}.stars span{position:absolute;border-radius:50%;background:#fff;animation:tw 4s infinite}
@keyframes tw{50%{opacity:.15}}
.scene{position:absolute;inset:0;z-index:2;display:flex;overflow-y:auto;overflow-x:hidden;padding:24px;text-align:center;animation:fadein 1.2s;transition:opacity .9s}
.leaving .scene{opacity:0}.scene>.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:820px;width:100%}
@keyframes fadein{from{opacity:0}}.fadein{animation:in 3s both}
.line{font-family:'Cormorant Garamond',serif;font-size:clamp(1.4rem,5vw,2.4rem);line-height:1.35;max-width:760px;animation:in 1.4s both;text-shadow:0 0 30px rgba(255,170,60,.45)}
.line.big{font-size:clamp(2.2rem,9vw,4.8rem);color:var(--gold);font-weight:600}.sub{opacity:.7;font-size:.95rem}
@keyframes in{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
.seq{min-height:9em;display:flex;align-items:center;justify-content:center}
.btn{min-height:50px;padding:15px 32px;border:0;border-radius:99px;background:linear-gradient(#ffd68a,var(--amber));color:#2a1200;font:600 1.05rem Inter;cursor:pointer;box-shadow:0 0 30px rgba(255,160,60,.55);animation:pulse 2.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(255,160,60,.9)}}
.music{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:9;background:#0008;color:var(--gold);border:1px solid #f5c76a55;border-radius:99px;padding:9px 14px;font:.8rem Inter;cursor:pointer}
.dust{position:fixed;inset:0;pointer-events:none}.dust span{position:absolute;bottom:-10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:floatup linear infinite}
.dust.petals span{background:#ff9d3c;border-radius:60% 0;width:10px!important;height:10px!important;box-shadow:none;opacity:.8}
@keyframes floatup{from{transform:translateY(0);opacity:0}15%{opacity:.9}to{transform:translateY(-105vh) translateX(30px);opacity:0}}
.diya{position:relative;width:76px;height:60px;border:0;background:none;cursor:pointer;flex:none}
.diya .bowl{position:absolute;bottom:0;left:0;width:100%;height:52%;border-radius:0 0 80px 80px;background:linear-gradient(#c8641e,#6e280a);box-shadow:inset 0 3px #ffb35a}
.diya .flame{position:absolute;bottom:46%;left:50%;width:14px;height:32px;margin-left:-7px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(#fff,#ffc14d 50%,#ff7a18);opacity:0;transform:scale(0);transform-origin:bottom;transition:.6s;animation:flick 1.3s infinite}
.diya.lit .flame{opacity:1;transform:scale(1)}
.diya .glow{position:absolute;left:50%;bottom:45%;width:260px;height:260px;transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(rgba(255,160,50,.4),transparent 65%);opacity:0;transition:opacity 1s;pointer-events:none}
.diya.lit .glow{opacity:1;animation:breathe 3s infinite}
@keyframes flick{50%{transform:scale(1,1.12) skewX(3deg)}}@keyframes breathe{50%{opacity:.6}}
.row{display:flex;flex-wrap:wrap;justify-content:center;max-width:560px}
.floor{position:absolute;bottom:3vh;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:24px;pointer-events:none}.floor.wrap{flex-wrap:wrap;padding:0 20px}
.lotus{width:90px;filter:drop-shadow(0 0 14px #ff9d3c88)}
.flood{position:fixed;left:50%;top:50%;width:60vmax;height:60vmax;margin:-30vmax;border-radius:50%;background:radial-gradient(rgba(255,170,60,.55),rgba(60,25,5,.4) 50%,transparent 70%);transform:scale(0);transition:transform 2.6s ease-out}.flood.on{transform:scale(2)}
.rocket{position:absolute;bottom:7vh;left:50%;margin-left:-15px;transition:transform 2.3s cubic-bezier(.5,0,.9,.4)}.rocket.fly{transform:translateY(-62vh)}
.rocket .spark{position:absolute;top:-4px;left:12px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px 6px #ffb347;animation:flick .15s infinite}.rocket.fly .spark{display:none}
.rocket .trail{position:absolute;top:100%;left:7px;width:16px;height:0;border-radius:0 0 50% 50%;background:linear-gradient(#ffe9a0,#ff7a18,transparent)}.rocket.fly .trail{height:180px;transition:height .6s}
.smoke{position:absolute;bottom:7vh;left:50%;width:60px;height:60px;border-radius:50%;background:#bbb3;filter:blur(18px);animation:floatup 4s infinite}.smoke.s2{animation-delay:-2s;margin-left:20px}
.title{position:absolute;top:22%;left:0;right:0;margin:auto;transition:top 1.5s}.title.small{top:12%}
.aura{position:fixed;left:50%;top:45%;width:90vmin;height:90vmin;margin:-45vmin;border-radius:50%;background:radial-gradient(rgba(255,200,100,.35),transparent 65%);animation:breathe 5s infinite}
.rangoli{position:fixed;left:50%;top:48%;width:min(92vw,640px);aspect-ratio:1;margin-top:calc(min(92vw,640px)/-2);margin-left:calc(min(92vw,640px)/-2);border-radius:50%;background:repeating-conic-gradient(#ff9d3c44 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 39% 72%,transparent 73%);mask:radial-gradient(circle,transparent 38%,#000 39% 72%,transparent 73%);animation:spin 90s linear infinite}
.rangoli.r2{width:min(60vw,420px);margin-top:calc(min(60vw,420px)/-2);margin-left:calc(min(60vw,420px)/-2);background:repeating-conic-gradient(#e0607a55 0 15deg,transparent 15deg 30deg);animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.om{font-size:4rem;color:var(--gold);text-shadow:0 0 40px var(--amber);animation:breathe 4s infinite}
.floatd{position:fixed;inset:0;pointer-events:none}.floatd .diya{position:absolute;bottom:-70px;animation:floatup 18s linear infinite}
.moon{position:fixed;top:7%;right:12%;width:64px;height:64px;border-radius:50%;background:#fff6dc;box-shadow:0 0 50px 12px #fff3c855}
.ridge{position:absolute;left:0;right:0;bottom:0;height:22vh;background:#02030a;clip-path:polygon(0 60%,15% 30%,30% 55%,48% 15%,65% 50%,82% 25%,100% 55%,100% 100%,0 100%);display:flex;justify-content:space-around;align-items:flex-end;padding-bottom:6px}
.cap{position:absolute;left:0;right:0;bottom:24vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px;z-index:4}
.lantern{position:absolute;width:90px;height:120px;transform:translate(-50%,-50%);transition:left 4s ease-in-out,top 4s ease-in-out,opacity 2s;z-index:3}
.lantern .body{position:relative;width:100%;height:100%;border-radius:14px 14px 22px 22px/34px 34px 22px 22px;background:linear-gradient(#6e2216,#341008);border:2px solid #c9893a;display:flex;align-items:center;justify-content:center;transition:.9s}
.lantern.lit .body{background:linear-gradient(#ffc064,#ff7a1f);box-shadow:0 0 70px 24px rgba(255,150,50,.55);animation:breathe 3s infinite}
.lantern .w{font:9px/1.25 Inter;color:#5a2000;padding:8px;word-break:break-word;max-height:100%;overflow:hidden}
.lf{position:absolute;bottom:6px;left:50%;width:10px;height:18px;margin-left:-5px;border-radius:50%;background:#fff6c8;box-shadow:0 0 16px 6px #ffb347;opacity:0}.lantern.lit .lf{opacity:1;animation:flick 1s infinite}
.lbl{position:absolute;top:100%;left:50%;width:170px;margin:10px 0 0 -85px;font-size:.75rem;opacity:.8}
.inf{position:absolute;left:50%;top:20%;width:min(60vw,300px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 12px #ffb347);z-index:5;stroke-dasharray:260;animation:draw 3s forwards}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
.wish{width:min(90vw,440px);padding:15px 18px;border-radius:14px;border:1px solid #f5c76a66;background:#0008;color:#fff;font:1rem Inter;outline:0;text-align:center}.wish:focus{box-shadow:0 0 24px #ff9d3c88}
.fest{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(100%,500px);margin:18px 0}
.mini{height:84px;border-radius:12px 12px 18px 18px;border:2px solid #c9893a;background:linear-gradient(#ffc064,#ff7a1f);box-shadow:0 0 30px rgba(255,150,50,.5);color:#3a1400;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:1.3rem;cursor:pointer;transition:transform 6s ease-out,opacity 6s}
.mini small{font:600 .62rem Inter}.mini.up{transform:translateY(-32vh);opacity:.3}.mini.up.top{transform:translateY(-52vh);opacity:.9}
.allglow{animation:flash 2.5s}@keyframes flash{30%{background:radial-gradient(#ffb34755,transparent 70%)}}
.car{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:14px 10vw;scrollbar-width:none}
.ph{flex:none;width:min(72vw,300px);scroll-snap-align:center;transition:transform .5s}.ph:hover{transform:translateY(-6px)}
.frame{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:1px solid #f5c76a99;box-shadow:0 0 36px rgba(255,160,60,.4);background:linear-gradient(160deg,#2a1410,#0d1330);display:flex;align-items:center;justify-content:center;color:#f5c76a99}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 16s ease-in-out infinite alternate}@keyframes zoom{to{transform:scale(1.1)}}
.ph figcaption{margin-top:12px;font:italic 1.1rem 'Cormorant Garamond',serif}
.letter{width:min(100%,560px);padding:20px 22px;border:1px solid #f5c76a55;border-radius:16px;background:#000a;text-align:left;font:clamp(1.15rem,4.8vw,1.5rem)/1.35 Caveat,cursive;display:flex;flex-direction:column;gap:10px}.letter p{animation:in 1.6s both}
.floatl{position:fixed;inset:0;pointer-events:none}.floatl i{position:absolute;bottom:-60px;width:30px;height:40px;border-radius:8px 8px 12px 12px;background:linear-gradient(#ffc064,#ff7a1f);box-shadow:0 0 30px 10px #ff9d3c66;animation:floatup 40s linear infinite}
</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,forwardRef,useImperativeHandle}=React
// ✏️ EDIT EVERYTHING HERE. {her} = her name, {HER} = UPPERCASE, {me} = your name.
// A line is a string, or {t:text, big:true, d:milliseconds, fx:fireworksCount}.
const C={
  herName:'Ahana', myName:'Yours',
  myWish:"My wish is that no matter how far life takes us, we always find our way back to each other.",
  music:'/music/song.mp3',                       // put your song at public/music/song.mp3
  colors:{gold:'#f5c76a',amber:'#ff9d3c',bg:'#05070f'},
  photos:[ // put images in public/images/
    {src:'/images/photo1.jpg',caption:'My favorite memories are the ones with you.'},
    {src:'/images/photo2.jpg',caption:"Here's to making many more."},
    {src:'/images/photo3.jpg',caption:'Every ordinary day, brighter.'},
    {src:'/images/photo4.jpg',caption:'Us.'}],
  festival:[
    {i:'🏮',l:'Happiness',w:'May happiness find you in every small moment.'},
    {i:'🏮',l:'Success',w:'May every effort you make bloom into success.'},
    {i:'🏮',l:'Health',w:'May you always be healthy and strong.'},
    {i:'🏮',l:'Family',w:'May your family be wrapped in warmth and love.'},
    {i:'🏮',l:'Dreams',w:'May every dream you chase come true.'},
    {i:'🏮',l:'Peace',w:'May your heart always be at peace.'},
    {i:'🏮',l:'Love',w:'May love follow you everywhere.'},
    {i:'♾️',l:'US ❤️',w:'US ❤️'}],
  diyas:['For your happiness ❤️','For your dreams ✨','For your family 🫶','For us. ♾️'],
  text:{
    intro:['This Diwali...','I wanted to make something different for you.',"Even though we're miles apart...",'I wanted us to celebrate it together. ❤️'],
    afterRocket:[{t:'Happy Diwali, My Love ❤️',big:true,d:2000},'May your Diwali be full of happiness, peace and success.','And may your smile shine brighter than every diya.'],
    blessings:['May Maa Lakshmi bless you with abundance and prosperity.','May Lord Ganesha remove every obstacle and bless you with wisdom and new beginnings.','Happiness, health and blessings to you and your family. ❤️'],
    light:['You know what I love most about Diwali?','The light.','Because somehow... you remind me of it.','You came into my life and made everything brighter.',{t:'YOU. ❤️',big:true,d:2500}],
    lanternIntro:['Distance may keep us apart...','...but we can still wish under the same sky. ❤️'],
    lanternReady:['Your wish is inside our lantern.','Ready?'],
    lanternRise:['Now look up...',"Somewhere under this sky, I'm making a wish for you too. ❤️"],
    lanternMeet:[{t:'Different places. Same sky. Same wish. ❤️',big:true,d:3000},{t:'For us. ♾️❤️',big:true,d:2500}],
    letter:['{her},',"I don't think I can ever properly explain how much light you have brought into my life.",'You have made ordinary days feel special, small moments feel meaningful, and my life feel a little more beautiful simply by being a part of it.',"This Diwali, I don't just wish for lights around you.",'I wish for a life filled with happiness, peace, success, laughter, beautiful memories and every dream you are chasing.','And selfishly, I hope I get to be there beside you through as many of those moments as possible.','Happy Diwali, my love.','You will always be one of the brightest lights in my life. ❤️','— {me}'],
    finale:['Close your eyes and make a wish. ✨',{t:'3',big:true,d:800},{t:'2',big:true,d:800},{t:'1',big:true,d:800},{t:'HAPPY DIWALI, {HER} ❤️',big:true,d:4500,fx:12},{t:'I LOVE YOU. ❤️',big:true,d:3000,fx:7},"I'll keep sending my light to you.",{t:'Happy Diwali, My Love. 🪔❤️',big:true,d:3000}]
  }
}
const fmt=a=>a.map(l=>{const o=typeof l==='string'?{t:l}:{...l};o.t=o.t.replaceAll('{HER}',C.herName.toUpperCase()).replaceAll('{her}',C.herName).replaceAll('{me}',C.myName);return o})

// Future long-distance mode: replace these stubs with a realtime backend (Firebase, Supabase, WebSocket...).
// publishWish(text): send her wish; onPartnerWish(cb): get notified when the other person lights their lantern.
const sync={publishWish:async()=>{},onPartnerWish:()=>()=>{}}


const Scene=({cls='',children})=><div className={'scene '+cls}><div className="in">{children}</div></div>
function Sequence({lines,onDone,onStep}){
  const [i,setI]=useState(0),o=lines[i],fin=useRef(false)
  useEffect(()=>{onStep&&onStep(i,o)
    const adv=()=>{if(fin.current)return;if(i<lines.length-1)setI(i+1);else{fin.current=true;onDone&&onDone()}}
    const id=setTimeout(adv,o.d||1000+o.t.length*28)
    const tap=e=>{if(e.target.closest('button,input'))return;clearTimeout(id);adv()}
    addEventListener('pointerdown',tap)
    return()=>{clearTimeout(id);removeEventListener('pointerdown',tap)}},[i])
  return <div key={i} className={'line'+(o.big?' big':'')}>{o.t}</div>
}
const Diya=({lit,onClick,style})=><button className={'diya'+(lit?' lit':'')} onClick={onClick} style={style} aria-label="diya"><i className="glow"/><i className="bowl"/><i className="flame"/></button>
const Next=({onClick,children='Continue'})=><button className="btn" onClick={onClick}>{children}</button>
function Dust({n=18,cls=''}){
  const d=useMemo(()=>Array.from({length:n},()=>({l:Math.random()*100,s:Math.random()*8+9,dl:Math.random()*12,z:Math.random()*3+1.5})),[n])
  return <div className={'dust '+cls}>{d.map((p,i)=><span key={i} style={{left:p.l+'%',width:p.z,height:p.z,animationDuration:p.s+'s',animationDelay:-p.dl+'s'}}/>)}</div>
}
function Stars({n=70}){
  const d=useMemo(()=>Array.from({length:n},()=>({x:Math.random()*100,y:Math.random()*100,s:Math.random()*2+.6,t:Math.random()*5})),[n])
  return <div className="stars">{d.map((p,i)=><span key={i} style={{left:p.x+'%',top:p.y+'%',width:p.s,height:p.s,animationDelay:-p.t+'s'}}/>)}</div>
}
const Lotus=({style})=><svg className="lotus" viewBox="0 0 100 60" style={style}>{[-64,-32,0,32,64].map(r=><ellipse key={r} cx="50" cy="32" rx="9" ry="26" transform={`rotate(${r} 50 56)`} fill="url(#lg)" stroke="#ffd9a0" strokeWidth=".6" opacity=".9"/>)}<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#ffe3b0"/><stop offset="1" stopColor="#e0607a"/></linearGradient></defs></svg>


const COLS=['255,205,100','255,160,60','255,235,185','255,120,90','255,190,120']
const Fireworks=forwardRef((_,ref)=>{
  const cv=useRef(),ps=useRef([]),rain=useRef(false)
  const api={
    burst(x,y,n=90,c){const k=innerWidth<600?.6:1,base=c||COLS[(Math.random()*COLS.length)|0]
      for(let i=0;i<n*k;i++){const a=Math.random()*6.283,s=Math.random()*5.5+1
        ps.current.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.007+Math.random()*.009,c:Math.random()<.35?COLS[0]:base,r:Math.random()*1.6+.8,g:.045})}},
    spark(x,y,n=4){for(let i=0;i<n;i++)ps.current.push({x,y,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.4-.3,l:1,d:.03,c:COLS[0],r:1.4,g:0})},
    volley(n=8){for(let i=0;i<n;i++)setTimeout(()=>api.burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.3),110),i*380)},
    rain(v){rain.current=v}}
  useImperativeHandle(ref,()=>api)
  useEffect(()=>{const c=cv.current,x=c.getContext('2d');let raf
    const size=()=>{const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}
    size();addEventListener('resize',size)
    const loop=()=>{x.clearRect(0,0,innerWidth,innerHeight);x.globalCompositeOperation='lighter'
      if(rain.current&&Math.random()<.5)ps.current.push({x:Math.random()*innerWidth,y:-5,vx:(Math.random()-.5)*.3,vy:.7+Math.random(),l:1,d:.004,c:COLS[0],r:1.3,g:0})
      const a=ps.current
      for(let i=a.length-1;i>=0;i--){const p=a[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=(p.g?0.985:1);p.l-=p.d
        if(p.l<=0){a.splice(i,1);continue}
        x.fillStyle=`rgba(${p.c},${p.l})`;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
      if(a.length>1200)a.splice(0,a.length-1200)
      raf=requestAnimationFrame(loop)}
    loop();return()=>{cancelAnimationFrame(raf);removeEventListener('resize',size)}},[])
  return <canvas ref={cv} className="fw"/>
})




function Dark({next}){
  const [lit,setLit]=useState(false)
  return <Scene><Dust/><div className={'flood'+(lit?' on':'')}/>
    <Diya lit style={{transform:'scale(.8)',marginBottom:30}}/>
    <div className="seq"><Sequence lines={fmt(C.text.intro)} onDone={()=>{setLit(true);setTimeout(next,1500)}}/></div></Scene>
}
function Rocket({fw,next}){
  const [p,setP]=useState('fuse'),[seq,setSeq]=useState(false)
  useEffect(()=>{const t=[setTimeout(()=>setP('fly'),1200),
    setTimeout(()=>{setP('boom');const w=innerWidth,h=innerHeight;fw.current.burst(w/2,h*.3,130,'255,205,100')
      setTimeout(()=>fw.current.burst(w*.28,h*.38),450);setTimeout(()=>fw.current.burst(w*.72,h*.36),800);fw.current.rain(true)},2800),
    setTimeout(()=>setSeq(true),4200)];return()=>{t.forEach(clearTimeout);fw.current.rain(false)}},[])
  return <Scene>
    {p!=='boom'&&<div className={'rocket '+p}><i className="spark"/><svg viewBox="0 0 30 90" width="30"><rect x="11" y="30" width="8" height="55" fill="#b8321f"/><rect x="11" y="30" width="8" height="8" fill="#f5c76a"/><path d="M11 30 L15 4 L19 30Z" fill="#e8a43a"/><path d="M11 85 L5 90 L11 80Z M19 85 L25 90 L19 80Z" fill="#8a2315"/></svg><i className="trail"/></div>}
    {p==='fuse'&&<><i className="smoke s1"/><i className="smoke s2"/></>}
    {p!=='fuse'&&p!=='fly'&&<div className={'line big title'+(seq?' small':'')}>{`HAPPY DIWALI, ${C.herName.toUpperCase()} ❤️`}</div>}
    {seq&&<div className="seq"><Sequence lines={fmt(C.text.afterRocket)} onDone={()=>setTimeout(next,500)}/></div>}
  </Scene>
}




function Blessings({next}){
  return <Scene cls="bless"><div className="aura"/><div className="rangoli"/><div className="rangoli r2"/><Dust n={16} cls="petals"/>
    <div className="om">ॐ</div><div className="seq"><Sequence lines={fmt(C.text.blessings)} onDone={()=>setTimeout(next,500)}/></div>
    <div className="floor"><Lotus/><Diya lit/><Diya lit/><Lotus/></div></Scene>
}
function Light({next}){
  const [n,setN]=useState(1)
  return <Scene><Dust/><div className="seq"><Sequence lines={fmt(C.text.light)} onStep={i=>setN(Math.min(14,1+Math.round(i*1.4)))} onDone={()=>setTimeout(next,500)}/></div>
    <div className="floor wrap">{Array.from({length:n},(_,i)=><Diya key={i} lit style={{transform:'scale(.6)',margin:-8}}/>)}</div></Scene>
}
function Love({next}){
  return <Scene><Dust n={26}/><div className="floatd">{[8,28,50,70,88].map((l,i)=><Diya key={i} lit style={{left:l+'%',animationDelay:i*-4+'s'}}/>)}</div>
    <div className="seq"><Sequence lines={fmt(C.text.love)} onDone={()=>setTimeout(next,3000)}/></div></Scene>
}





const Lantern=({pos,lit,txt,show=true,lbl})=><div className={'lantern'+(lit?' lit':'')} style={{left:pos[0]+'%',top:pos[1]+'%',opacity:show?1:0}}>
  <div className="body">{lit&&<span className="w">{txt}</span>}<i className="lf"/></div>{lbl&&<div className="lbl">{lbl}</div>}</div>
const H={rise:[27,24],meet:[43,22],merged:[50,20]},M={rise:[73,20],meet:[57,22],merged:[50,20]}
function LanternScene({fw,next}){
  const [ph,setPh]=useState('intro'),[txt,setTxt]=useState(''),[wish,setWish]=useState('')
  const lit=!['intro','idle'].includes(ph),flying=['rise','meet','merged'].includes(ph)
  useEffect(()=>{const id=setInterval(()=>fw.current.burst(innerWidth*(.1+Math.random()*.8),innerHeight*(.1+Math.random()*.2),35),3600);return()=>clearInterval(id)},[])
  useEffect(()=>{if(ph==='meet'){const t=setTimeout(()=>{setPh('merged');fw.current.burst(innerWidth/2,innerHeight*.2,160,'255,205,100')},4500);return()=>clearTimeout(t)}},[ph])
  const light=()=>{setPh('lit');fw.current.burst(innerWidth/2,innerHeight*.5,50,'255,190,90')}
  const send=()=>{const w=txt.trim()||'Something I want the universe to know ❤️';setWish(w);sync.publishWish(w);setPh('ready')}
  return <Scene cls="sky"><Dust n={24}/><div className="moon"/>
    <Lantern pos={H[ph]||[50,52]} lit={lit} txt={wish} lbl={['rise','meet'].includes(ph)?'Her wish':''}/>
    <Lantern pos={M[ph]||[75,40]} lit show={flying} txt={C.myWish} lbl={['rise','meet'].includes(ph)?'My wish':''}/>
    {ph==='merged'&&<svg className="inf" viewBox="0 0 100 60"><path d="M50 30C60 12 90 12 90 30C90 48 60 48 50 30C40 12 10 12 10 30C10 48 40 48 50 30Z" fill="none" stroke="#ffd57a" strokeWidth="2.2"/></svg>}
    <div className="ridge"><Diya lit style={{transform:'scale(.5)'}}/><Diya lit style={{transform:'scale(.5)'}}/><Diya lit style={{transform:'scale(.5)'}}/></div>
    <div className="cap">
      {ph==='intro'&&<Sequence lines={fmt(C.text.lanternIntro)} onDone={()=>setPh('idle')}/>}
      {ph==='idle'&&<Next onClick={light}>Light Our Lantern</Next>}
      {ph==='lit'&&<><div className="line">Make a wish first... ✨</div>
        <input className="wish" maxLength={140} value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Something you want the universe to know..." aria-label="Write a wish for us"/>
        <Next onClick={send}>Light Our Wish ❤️</Next></>}
      {ph==='ready'&&<Sequence lines={fmt(C.text.lanternReady)} onDone={()=>setPh('rise')}/>}
      {ph==='rise'&&<Sequence lines={fmt(C.text.lanternRise)} onDone={()=>setPh('meet')}/>}
      {ph==='merged'&&<Sequence lines={fmt(C.text.lanternMeet)} onDone={()=>setTimeout(next,500)}/>}
    </div></Scene>
}
function Festival({fw,next}){
  const [open,setOpen]=useState([]),[msg,setMsg]=useState('')
  const tap=(i,e)=>{if(open.includes(i))return;setOpen([...open,i]);setMsg(C.festival[i].w)
    const r=e.currentTarget.getBoundingClientRect();fw.current.burst(r.left+r.width/2,r.top,40)}
  const last=C.festival.length-1
  return <Scene cls="sky"><Dust n={24}/><div className="line">A sky full of wishes</div><p className="sub">Tap a lantern</p>
    <div className="fest">{C.festival.map((f,i)=><button key={i} className={'mini'+(open.includes(i)?(i===last?' up top':' up'):'')} onClick={e=>tap(i,e)}><span>{f.i}</span><small>{f.l}</small></button>)}</div>
    <div className={'line'+(open.includes(last)?' big':'')} key={msg} style={{minHeight:'3em'}}>{msg}</div>
    {open.includes(last)&&<Next onClick={next}/>}</Scene>
}




function Diyas({fw,next}){
  const [lit,setLit]=useState([]),[msg,setMsg]=useState('')
  const all=lit.length===C.diyas.length
  const tap=(i,e)=>{if(lit.includes(i))return;setLit([...lit,i]);setMsg(C.diyas[i])
    const r=e.currentTarget.getBoundingClientRect();fw.current.burst(r.left+r.width/2,r.top,30)
    if(lit.length+1===C.diyas.length)fw.current.volley(5)}
  return <Scene cls={all?'allglow':''}><Dust/><div className="line">Let's Light Some More Happiness</div>
    <div className="row">{C.diyas.map((_,i)=><Diya key={i} lit={lit.includes(i)} onClick={e=>tap(i,e)} style={{margin:14}}/>)}</div>
    <div className={'line'+(lit.includes(C.diyas.length-1)?' big':'')} key={msg} style={{minHeight:'3em'}}>{msg||'Tap each diya'}</div>
    {all&&<Next onClick={next}/>}</Scene>
}
function Gallery({next}){
  return <Scene><div className="line">A Little Gallery of Us ❤️</div>
    <div className="car">{C.photos.map((p,i)=><figure className="ph" key={i}>
      <div className="frame"><span>Add photo {i+1}<br/><small>public/images</small></span>
      <img src={p.src} alt={p.caption} loading="lazy" onError={e=>e.currentTarget.style.display='none'}/></div>
      <figcaption>{p.caption}</figcaption></figure>)}</div>
    <Next onClick={next}/></Scene>
}
function Letter({next}){
  const L=fmt(C.text.letter),[n,setN]=useState(1),end=useRef()
  useEffect(()=>{if(n>=L.length)return;const adv=()=>setN(x=>Math.min(x+1,L.length)),t=setTimeout(adv,1500+L[n-1].t.length*22),tap=e=>{if(!e.target.closest('button'))adv()};addEventListener('pointerdown',tap);return()=>{clearTimeout(t);removeEventListener('pointerdown',tap)}},[n])
  useEffect(()=>end.current?.scrollIntoView({behavior:'smooth',block:'end'}),[n])
  return <Scene><div className="line" style={{fontSize:"1.3rem"}}>A Little Something From My Heart ❤️</div>
    <div className="letter">{L.slice(0,n).map((l,i)=><p key={i}>{l.t}</p>)}<span ref={end}/></div>
    {n>=L.length&&<Next onClick={next}/>}</Scene>
}




function Finale({fw}){
  const [done,setDone]=useState(false),lines=fmt(C.text.finale)
  useEffect(()=>{if(!done)return;const id=setInterval(()=>fw.current.burst(innerWidth*(.1+Math.random()*.8),innerHeight*(.1+Math.random()*.25),40),4500);return()=>clearInterval(id)},[done])
  return <Scene cls="sky">
    {!done&&<><Diya lit style={{transform:'scale(.8)',marginBottom:30}}/><div className="seq"><Sequence lines={lines} onStep={(i,o)=>o.fx&&fw.current.volley(o.fx)} onDone={()=>setDone(true)}/></div></>}
    {done&&<><div className="moon"/><div className="floatl">{[10,30,55,75,90].map((l,i)=><i key={i} style={{left:l+'%',animationDelay:i*-9+'s'}}/>)}</div>
      <div className="line big fadein">Happy Diwali, My Love. 🪔❤️</div>
      <div className="floor"><Diya lit/><Diya lit/><Diya lit/></div></>}
  </Scene>
}










const scenes=[Dark,Rocket,Blessings,Light,LanternScene,Diyas,Finale]
function App(){
  const fw=useRef(),au=useRef(),[go,setGo]=useState(false),[i,setI]=useState(0),[leave,setLeave]=useState(false),[music,setMusic]=useState(false)
  const busy=useRef(false),next=()=>{if(busy.current)return;busy.current=true;setLeave(true);setTimeout(()=>{setI(x=>Math.min(x+1,scenes.length-1));setLeave(false);busy.current=false},700)}
  const toggle=()=>{if(music)au.current.pause();else au.current.play().catch(()=>{});setMusic(!music)}
  const S=scenes[i]
  return <div className={`app s${i}${leave?' leaving':''}`} style={{'--gold':C.colors.gold,'--amber':C.colors.amber,'--bg':C.colors.bg}}
    onPointerDown={e=>fw.current.spark(e.clientX,e.clientY,8)} onPointerMove={e=>e.pointerType==='mouse'&&fw.current.spark(e.clientX,e.clientY,1)}>
    <Stars/><Fireworks ref={fw}/><audio ref={au} src={C.music} loop preload="none"/>
    {!go?<div className="scene"><div className="in"><Diya lit style={{marginBottom:24}}/><div className="line">For {C.herName}</div><p className="sub">Tap anywhere to move ahead.</p><button className="btn" onClick={()=>setGo(true)}>Begin</button></div></div>
      :<><S key={i} fw={fw} next={next}/><button className="music" onClick={toggle}>🎵 Music {music?'On':'Off'}</button></>}
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script></body></html>
